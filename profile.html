<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Perfil público · Skyke3D</title>
<style>
:root{--bg:#efe6d8;--card:#fffaf1;--ink:#2b2433;--mut:#6a6072;--line:#e2d6c3;--acc:#c9741a;--on:#1f9d55;--off:#8a8394}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15121c;--card:#1f1a2b;--ink:#f3eefc;--mut:#b2a8c4;--line:#352d47;--acc:#ffb23e;--on:#4bd488;--off:#8c84a0}}
:root[data-theme=dark]{--bg:#15121c;--card:#1f1a2b;--ink:#f3eefc;--mut:#b2a8c4;--line:#352d47;--acc:#ffb23e;--on:#4bd488;--off:#8c84a0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;text-align:center}
#face{display:block;width:128px;height:128px;margin:0 auto 10px;border-radius:50%;background:#ffffff1a;border:3px solid var(--acc)}
h1{margin:4px 0 2px;font-size:1.5rem;overflow-wrap:anywhere}
h2{font-size:1rem;margin:0 0 6px}
.st{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:.9rem}
.st i{width:10px;height:10px;border-radius:50%;background:var(--off)}
.st.on i{background:var(--on)}
.md{margin:8px 0 0;font-style:italic;overflow-wrap:anywhere}.md:empty{display:none}
.hearts{margin:10px 0 0;font-size:1.05rem}
.box{margin:16px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-align:left;overflow-wrap:anywhere}
.box p{margin:0;white-space:pre-wrap}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:.95rem}
.facts dt{color:var(--mut)}.facts dd{margin:0}
#bdl{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
#bdl li{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem}
#gbl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#gbl li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
#gbl b{display:block;font-size:.85rem;color:var(--mut)}
.small{margin:8px 0 0;font-size:.8rem;color:var(--mut)}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
button{font:inherit;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.msg{color:var(--mut);margin:12px 0 0}
.note{margin:18px 0 0;font-size:.8rem;color:var(--mut)}
#err,#labels{display:none!important}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="labels" hidden></div>
<main aria-live="polite">
<div id="view" hidden>
<canvas id="face" width="256" height="256" role="img" aria-label="Rosto do avatar"></canvas>
<h1 id="nm"></h1>
<div id="st" class="st"><i></i><span></span></div>
<p id="md" class="md"></p>
<p id="hearts" class="hearts" hidden></p>
<section id="ab" class="box" hidden><h2>Sobre mim</h2><p id="bio"></p></section>
<section id="fc" class="box" hidden><dl id="facts" class="facts"></dl></section>
<section id="bd" class="box" hidden><h2>Emblemas</h2><ul id="bdl"></ul></section>
<section id="gb" class="box" hidden><h2>Recados</h2><ul id="gbl"></ul><p class="small">Os recados ficam por pouco tempo e depois somem.</p></section>
<div class="acts"><button type="button" id="cp">📋 Copiar link</button></div>
<p id="cpm" class="msg" role="status"></p>
</div>
<div id="none" hidden>
<h1>Perfil não encontrado</h1>
<p class="msg" id="why"></p>
</div>
<p class="note">Este perfil foi criado e é mantido pelo próprio jogador. Só aparece porque ele quis.</p>
</main>
<script src="/vendor/three-r186.min.js"></script>
<script src="/assets/catalog.js"></script>
<script src="/assets/app-base.js"></script>
<script src="/assets/portrait-stubs.js"></script>
<script src="/assets/app-avatar.js"></script>
<script src="/assets/portrait.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  function ago(ms) {
    var m = Math.max(1, Math.round((Date.now() - ms) / 60000));
    if (m < 60) return 'há ' + m + ' min';
    var h = Math.round(m / 60);
    if (h < 48) return 'há ' + h + (h === 1 ? ' hora' : ' horas');
    return 'há ' + Math.round(h / 24) + ' dias';
  }
  function fact(dl, k, v) {
    var dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k;
    dd.textContent = v;
    dl.appendChild(dt);
    dl.appendChild(dd);
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  var lastCfg = '';
  function show(p) {
    $('none').hidden = true;
    $('view').hidden = false;
    document.title = p.name + ' · Skyke3D';
    $('nm').textContent = p.name;
    var st = $('st');
    st.className = 'st' + (p.online ? ' on' : '');
    st.lastChild.textContent = p.online ? 'Online agora' : 'Visto por último ' + ago(p.seenAt);
    $('md').textContent = p.mood ? '“' + p.mood + '”' : '';
    var hs = $('hearts');
    hs.hidden = !(p.likes > 0);
    hs.textContent = '❤️ ' + p.likes + (p.likes === 1 ? ' curtida' : ' curtidas');
    $('bio').textContent = p.bio || '';
    $('ab').hidden = !p.bio;
    var dl = $('facts');
    clear(dl);
    if (p.like) fact(dl, 'Gosta de', String(p.like));
    if (p.world) fact(dl, 'Mundo favorito', String(p.world));
    $('fc').hidden = !dl.firstChild;
    var bl = $('bdl'), badges = Array.isArray(p.badges) ? p.badges : [];
    clear(bl);
    badges.slice(0, 12).forEach(function (b) {
      var li = document.createElement('li');
      li.textContent = String(b.icon || '') + ' ' + String(b.name || '');
      li.title = String(b.name || '');
      bl.appendChild(li);
    });
    $('bd').hidden = !badges.length;
    var gl = $('gbl'), book = Array.isArray(p.book) ? p.book : [];
    clear(gl);
    book.slice(0, 20).forEach(function (m) {
      var li = document.createElement('li'), b = document.createElement('b');
      b.textContent = String(m.name || '');
      li.appendChild(b);
      li.appendChild(document.createTextNode(String(m.text || '')));
      gl.appendChild(li);
    });
    $('gb').hidden = !book.length;
    var key = JSON.stringify(p.cfg || {});
    if (key !== lastCfg && window.skyPortrait) {
      lastCfg = key;
      window.skyPortrait($('face'), p.cfg || {});
    }
  }
  function none(txt) {
    $('view').hidden = true;
    $('none').hidden = false;
    $('why').textContent = txt;
    document.title = 'Perfil público · Skyke3D';
  }
  var timer = 0;
  function load() {
    clearTimeout(timer);
    var id = location.hash.slice(1);
    if (!/^[0-9a-f]{20}$/.test(id)) return none('O link está incompleto. Peça o link de novo ao jogador.');
    fetch('/profile.json?id=' + id, { cache: 'no-store', credentials: 'omit' })
      .then(function (r) {
        if (r.status === 429) throw new Error('rate');
        return r.ok ? r.json() : null;
      })
      .then(function (p) {
        if (!p || typeof p.name !== 'string') return none('Este jogador não tem perfil público, ou apagou o perfil.');
        show(p);
        if (p.online) timer = setTimeout(load, 30000);
      })
      .catch(function (e) {
        none(e && e.message === 'rate' ? 'Muitas visitas seguidas. Tente de novo daqui a um minuto.' : 'Não consegui abrir o perfil agora. Tente de novo.');
      });
  }
  $('cp').onclick = function () {
    var done = function (t) { $('cpm').textContent = t; };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(location.href).then(function () { done('Link copiado.'); }, function () { done('Copie o endereço que está na barra do navegador.'); });
    else done('Copie o endereço que está na barra do navegador.');
  };
  addEventListener('hashchange', load);
  load();
})();
</script>
</body>
</html>
