name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:7}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; nada a fazer."
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            gh release create "$TAG" \
              --title "Skyke3D $TAG" \
              --generate-notes \
              --latest
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Skyke3D $TAG" \
              --generate-notes \
              --latest
          fi
