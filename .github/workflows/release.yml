name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    name: Test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build and test launcher (Java)
        run: launcher/build.sh

  release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # NSIS gera o instalador do launcher para Windows e o MinGW-w64 compila o Skyke3D.exe (os dois rodam no Linux).
      # Se a instalação falhar, o Release sai sem o .exe.
      - name: Install NSIS and MinGW-w64 (Windows installer)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 || echo "::warning::NSIS ou MinGW-w64 indisponível; o instalador do Windows não será gerado."

      # Assinatura dos .exe (launcher/packaging/windows/sign.sh): só acontece se o secret SIGN_STORETYPE existir. Sem ele, os .exe
      # saem sem assinatura, como antes. Os secrets nunca aparecem no log (o GitHub os mascara) e não chegam a PRs de forks.
      - name: Build launcher (Java) and installers
        env:
          SIGN_STORETYPE: ${{ secrets.SIGN_STORETYPE }}
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_KEYSTORE: ${{ secrets.SIGN_KEYSTORE }}
          SIGN_STOREPASS: ${{ secrets.SIGN_STOREPASS }}
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
          SIGN_KEYPASS: ${{ secrets.SIGN_KEYPASS }}
          SIGN_TSA: ${{ secrets.SIGN_TSA }}
        run: launcher/build.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versão inválida em package.json: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; nada a fazer."
            exit 0
          fi

          # o .jar universal e os pacotes instaláveis que o build conseguiu gerar (.exe do Windows, .deb e .tar.gz do Linux)
          ASSETS=(launcher/build/skyke3d-launcher.jar launcher/build/skyke3d-launcher.jar.sha256)
          for f in skyke3d-launcher-setup.exe skyke3d-launcher.deb skyke3d-launcher-linux.tar.gz SHA256SUMS.txt; do
            if [ -f "launcher/build/$f" ]; then ASSETS+=("launcher/build/$f"); fi
          done

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-parse "$TAG^{commit}")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::A tag $TAG já existe em $TAG_SHA; atualize a versão em package.json."
              exit 1
            fi
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Skyke3D $TAG" \
              --generate-notes \
              --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Skyke3D $TAG" \
              --generate-notes \
              --latest
          fi
